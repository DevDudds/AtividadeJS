    <script>
        const btn = document.getElementById("btn");
        const container = document.getElementById("container");
        let id = 0;
        btn.addEventListener("click", () => {
            const p = document.createElement("p");
            id++;
            container.innerHTML += 
            `
            <div class="card" id="card-${id}">
                <div class="curso">
                    <h2>Curso</h2>
                </div>
                <h2>Git e Github</h2>
            </div>
            `;
        });
    </script>
